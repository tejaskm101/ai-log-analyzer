spring.application.name=AILogAnalyzer

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_log_analyzer
spring.datasource.username=mac
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=ai-log-analyzer
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp